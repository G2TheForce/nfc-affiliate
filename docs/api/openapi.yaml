openapi: 3.1.0
info:
  title: NFC Affiliates API
  version: 1.2.0
  description: |
    Release 1.2.0 (Phases 1-11). 1.1.0 added campaigns, marketing materials, fraud flags and the public affiliate programme facts. 1.2.0 adds staff accounts (invite, role change, disable), programme settings, editing your own profile and password, product photos, and category rename, hide and delete. Money is integer minor units (paisa) with a currency code.
    Web app: Sanctum session cookie plus X-XSRF-TOKEN.
    API clients: send `device_name` to login or register and use the returned bearer token.
    All errors are JSON. Validation errors return 422 with `message` and `errors`.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    session: { type: apiKey, in: cookie, name: nfc-affiliates-session, description: 'Cookie name comes from APP_NAME (default nfc-affiliates-session)' }
  schemas:
    User:
      type: object
      properties:
        id: { type: string, description: Public ULID }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'], example: '+9779812345678' }
        email_verified: { type: boolean }
        status: { type: string, enum: [active, disabled] }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        is_staff: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
    AuthResult:
      type: object
      properties:
        token: { type: string, description: Only when device_name was sent }
        token_type: { type: string, example: Bearer }
        user: { $ref: '#/components/schemas/User' }
    Message:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    AuditLog:
      type: object
      properties:
        id: { type: integer }
        action: { type: string }
        actor: { type: [object, 'null'], properties: { id: { type: string }, name: { type: string } } }
        subject_type: { type: [string, 'null'] }
        subject_id: { type: [string, 'null'] }
        properties: { type: [object, 'null'], description: Secret-looking keys are redacted }
        created_at: { type: string, format: date-time }
    AffiliateDetails:
      type: object
      properties:
        display_name: { type: string, maxLength: 120 }
        country_code: { type: string, minLength: 2, maxLength: 2, example: NP }
        city: { type: [string, 'null'] }
        address_line: { type: [string, 'null'] }
        promotion_channels:
          type: array
          minItems: 1
          items: { type: string, enum: [website, facebook, instagram, tiktok, youtube, whatsapp, viber, telegram, email, offline, other] }
        website_urls: { type: array, maxItems: 5, items: { type: string, format: uri } }
        audience_description: { type: [string, 'null'], maxLength: 2000 }
    AffiliateProfile:
      allOf:
        - $ref: '#/components/schemas/AffiliateDetails'
        - type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [pending, approved, rejected, suspended, deactivated] }
            status_label: { type: string }
            referral_code: { type: [string, 'null'] }
            referral_slug: { type: [string, 'null'] }
            applied_at: { type: [string, 'null'], format: date-time }
            approved_at: { type: [string, 'null'], format: date-time }
            can_reapply_at: { type: [string, 'null'], format: date-time }
            needs_terms_acceptance: { type: boolean }
            current_terms_version: { type: [string, 'null'] }
            history: { type: array, items: { type: object, properties: { status: { type: string }, status_label: { type: string }, reason: { type: [string, 'null'] }, at: { type: string } } } }
            terms_accepted: { type: array, items: { type: object, properties: { version: { type: string }, accepted_at: { type: string } } } }
    Product:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        image_url: { type: [string, 'null'], format: uri, description: 'Public photo address under /media/products/, or null when the product has no photo' }
        price_minor: { type: integer, example: 150000 }
        currency: { type: string, example: NPR }
        category: { type: [object, 'null'], properties: { id: { type: integer }, name: { type: string }, slug: { type: string } } }
        is_active: { type: boolean, description: Only in /admin responses }
    CartItems:
      type: array
      minItems: 1
      maxItems: 50
      items: { type: object, required: [product_id, quantity], properties: { product_id: { type: string }, quantity: { type: integer, minimum: 1, maximum: 100 } } }
    Order:
      type: object
      description: Customer view. Staff responses mask email and phone and add `attribution` (attribution.view).
      properties:
        id: { type: string }
        order_number: { type: string, example: NFC-261011-7KQ2MX }
        status: { type: string, enum: [pending_payment, paid, partially_refunded, cancelled, refunded] }
        status_label: { type: string }
        currency: { type: string }
        subtotal_minor: { type: integer }
        discount_minor: { type: integer }
        shipping_minor: { type: integer }
        total_minor: { type: integer }
        coupon_code: { type: [string, 'null'] }
        placed_at: { type: string, format: date-time }
        fulfilment_status: { type: string, enum: [unfulfilled, processing, shipped, delivered], description: 'Delivery progress, separate from payment (cash on delivery ships before it is paid)' }
        fulfilment_label: { type: string }
        carrier: { type: [string, 'null'] }
        tracking_number: { type: [string, 'null'] }
        shipped_at: { type: [string, 'null'], format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        items: { type: array, items: { type: object, properties: { sku: { type: string }, name: { type: string }, unit_price_minor: { type: integer }, quantity: { type: integer }, discount_minor: { type: integer }, line_total_minor: { type: integer } } } }
    AffiliateLink:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        url: { type: string, example: 'https://store.example/ref/AB23CD45/insta-bio' }
        product: { type: [object, 'null'] }
        campaign: { type: [object, 'null'], description: 'Campaign the link was made for: { id, name }', properties: { id: { type: string }, name: { type: string } } }
        utm_source: { type: [string, 'null'] }
        utm_medium: { type: [string, 'null'] }
        utm_campaign: { type: [string, 'null'] }
        is_active: { type: boolean }
    ReferralTotals:
      type: object
      properties:
        clicks: { type: integer }
        unique_clicks: { type: integer }
        orders: { type: integer, description: 'Placed and not cancelled. Not sales.' }
        cancelled_orders: { type: integer }
        order_value_minor: { type: integer, description: Subtotal minus discount of placed orders }
        conversion_rate: { type: [number, 'null'], description: Orders per 100 unique clicks }
    Balances:
      type: object
      description: Sums over ledger entries, in minor units. Available can be negative (a recoverable balance after a refund of paid commission).
      properties:
        pending: { type: integer }
        approved: { type: integer }
        available: { type: integer }
        reserved: { type: integer }
        paid: { type: integer }
        reversed: { type: integer }
    Commission:
      type: object
      description: Affiliate view masks the order number. The staff view adds order_id, affiliate, rule and hold_reason, and shows the full order number.
      properties:
        id: { type: string }
        order_number: { type: string }
        product_name: { type: string }
        sku: { type: string }
        quantity: { type: integer }
        kind: { type: string, enum: [percent, fixed] }
        rate_bp: { type: [integer, 'null'] }
        fixed_minor: { type: [integer, 'null'] }
        base_minor: { type: integer, description: Line total after discounts }
        amount_minor: { type: integer, description: Amount at creation }
        reversed_minor: { type: integer }
        net_minor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [pending, approved, available, paid, reversed] }
        partially_reversed: { type: boolean }
        on_hold: { type: boolean }
        eligible_at: { type: string, format: date-time }
    LedgerEntry:
      type: object
      properties:
        type: { type: string, enum: [accrual, approval, release, refund_reversal, void, adjustment, payout_reserve, payout_release, payout_paid] }
        label: { type: string }
        from_bucket: { type: [string, 'null'] }
        to_bucket: { type: [string, 'null'] }
        amount_minor: { type: integer, minimum: 1 }
        currency: { type: string }
        commission_id: { type: [string, 'null'] }
        adjustment_id: { type: [string, 'null'] }
        payout_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Payout:
      type: object
      description: Affiliate view. Destination is masked (bank or wallet name and last four digits).
      properties:
        id: { type: string }
        amount_minor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [requested, approved, paid, rejected, failed, cancelled] }
        status_label: { type: string }
        method_type: { type: string, enum: [bank_transfer, esewa, khalti] }
        destination: { type: string }
        requested_at: { type: string, format: date-time }
        reviewed_at: { type: [string, 'null'], format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        payment_reference: { type: [string, 'null'] }
        reason: { type: [string, 'null'], description: Rejection or failure reason }
        commission_count: { type: integer }
        can_cancel: { type: boolean }
    StaffPayout:
      allOf:
        - $ref: '#/components/schemas/Payout'
        - type: object
          properties:
            affiliate: { type: object }
            account_name: { type: string }
            review_note: { type: [string, 'null'] }
            failure_reason: { type: [string, 'null'] }
            reviewed_by: { type: [string, 'null'] }
            paid_by: { type: [string, 'null'] }
            can_review: { type: boolean }
            can_reject: { type: boolean }
            can_mark_paid: { type: boolean }
            can_mark_failed: { type: boolean }
    CommissionRule:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        scope: { type: string, enum: [global, plan, category, product, affiliate, campaign] }
        target: { type: [object, 'null'], description: 'id is the plan, product, affiliate or campaign public id, or the category slug' }
        kind: { type: string, enum: [percent, fixed, exclude] }
        rate_bp: { type: [integer, 'null'] }
        fixed_minor: { type: [integer, 'null'] }
        currency: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        is_active: { type: boolean }
        version: { type: integer }
    Adjustment:
      type: object
      properties:
        id: { type: string }
        affiliate: { type: object }
        commission_id: { type: [string, 'null'] }
        amount_minor: { type: integer, description: Signed }
        reason: { type: string }
        status: { type: string, enum: [pending_approval, approved, rejected] }
        created_by: { type: [string, 'null'] }
        can_decide: { type: boolean, description: False for the proposer }
        decided_by: { type: [string, 'null'] }
    ReconciliationRun:
      type: object
      properties:
        id: { type: string }
        result: { type: string, enum: [clean, drift] }
        commissions_checked: { type: integer }
        affiliates_checked: { type: integer }
        entries_checked: { type: integer }
        issues: { type: array, items: { type: object } }
        triggered_by: { type: string }
        finished_at: { type: string, format: date-time }
    PaymentAttempt:
      type: object
      description: One customer attempt to pay online. Only the provider's status API can complete it.
      properties:
        id: { type: string }
        order: { type: object, properties: { id: { type: string }, order_number: { type: string } } }
        provider: { type: string, enum: [esewa, khalti] }
        provider_reference: { type: [string, 'null'], description: eSewa transaction_uuid or Khalti pidx }
        provider_transaction_id: { type: [string, 'null'] }
        amount_minor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [initiated, pending, completed, failed, needs_review] }
        status_label: { type: string }
        provider_status: { type: [string, 'null'], example: COMPLETE }
        review_reason: { type: [string, 'null'] }
        reviewed_by: { type: [string, 'null'] }
        reviewed_at: { type: [string, 'null'], format: date-time }
        review_note: { type: [string, 'null'] }
        check_count: { type: integer }
        last_checked_at: { type: [string, 'null'], format: date-time }
        next_check_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    Campaign:
      type: object
      description: 'Staff view of a campaign. Campaigns are never deleted; switch them off (is_active false) or end them (ends_at).'
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        state: { type: string, enum: [running, upcoming, ended] }
        is_active: { type: boolean }
        budget_minor: { type: [integer, 'null'], description: Informational only; never limits commission }
        currency: { type: string }
        all_affiliates: { type: boolean }
        affiliates: { type: array, items: { type: object, properties: { id: { type: string }, display_name: { type: string }, referral_code: { type: [string, 'null'] } } } }
        products: { type: array, description: Empty means every product, items: { type: object, properties: { id: { type: string }, name: { type: string } } } }
        rule:
          type: [object, 'null']
          description: The campaign-scope commission rule in force now
          properties: { id: { type: string }, name: { type: string }, kind: { type: string, enum: [percent, fixed] }, rate_bp: { type: [integer, 'null'] }, fixed_minor: { type: [integer, 'null'] } }
        stats:
          type: object
          description: Paid and partially refunded orders that came through the campaign, their product sales after discounts, and net commission
          properties: { orders: { type: integer }, sales_minor: { type: integer }, commission_minor: { type: integer } }
        created_at: { type: [string, 'null'], format: date-time }
    CampaignInput:
      type: object
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time, description: Must be after starts_at }
        budget_minor: { type: [integer, 'null'], minimum: 1 }
        is_active: { type: boolean }
        all_affiliates: { type: boolean, description: 'When false, affiliate_ids must hold at least one affiliate' }
        affiliate_ids: { type: array, maxItems: 500, items: { type: string } }
        product_ids: { type: array, maxItems: 200, items: { type: string }, description: Empty means every product }
    AffiliateCampaign:
      type: object
      description: A running campaign open to the signed-in affiliate
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        all_products: { type: boolean }
        products: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, slug: { type: string } } } }
        commission:
          type: [object, 'null']
          description: The campaign rate in force; null means the affiliate's normal rates apply
          properties: { kind: { type: string, enum: [percent, fixed] }, rate_bp: { type: [integer, 'null'] }, fixed_minor: { type: [integer, 'null'] }, currency: { type: [string, 'null'] } }
        coupons: { type: array, description: The affiliate's own active coupons for this campaign, items: { type: object, properties: { code: { type: string }, discount_type: { type: string, enum: [percent, fixed] }, discount_value: { type: integer } } } }
        my_links: { type: integer, description: Number of the affiliate's links made for this campaign }
    MarketingAsset:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        kind: { type: string, enum: [image, video, document, archive, text] }
        caption: { type: [string, 'null'], description: Suggested post text; the whole material for kind text }
        has_file: { type: boolean }
        mime: { type: [string, 'null'], description: Detected from the file content }
        size_bytes: { type: [integer, 'null'] }
        campaign: { type: [object, 'null'], properties: { id: { type: string }, name: { type: string } } }
        product: { type: [object, 'null'], properties: { id: { type: string }, name: { type: string }, slug: { type: string } } }
        created_at: { type: [string, 'null'], format: date-time }
    StaffMarketingAsset:
      allOf:
        - $ref: '#/components/schemas/MarketingAsset'
        - type: object
          properties:
            is_active: { type: boolean }
            original_name: { type: [string, 'null'] }
            download_count: { type: integer, description: Affiliate downloads; inline previews are not counted }
    FraudFlag:
      type: object
      properties:
        id: { type: string }
        signal: { type: string, enum: [high_conversion, clicks_without_orders, refund_rate, rapid_earnings, large_payout, payout_after_detail_change] }
        signal_label: { type: string }
        guidance: { type: string, description: What a reviewer should look at }
        severity: { type: string, enum: [low, medium, high] }
        details: { type: object, description: What was measured and the threshold it crossed }
        subject: { type: [object, 'null'], description: 'For payout flags: { type: payout, id: payout public id }', properties: { type: { type: string }, id: { type: string } } }
        status: { type: string, enum: [open, dismissed, confirmed] }
        status_label: { type: string }
        affiliate: { type: [object, 'null'], properties: { id: { type: string }, display_name: { type: string }, referral_code: { type: [string, 'null'] } } }
        detected_at: { type: [string, 'null'], format: date-time }
        reviewed_by: { type: [string, 'null'] }
        reviewed_at: { type: [string, 'null'], format: date-time }
        review_note: { type: [string, 'null'] }
    StaffMember:
      type: object
      properties:
        id: { type: string, description: Public ULID }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: [string, 'null'], enum: [super_admin, affiliate_manager, finance_manager, support, null] }
        role_label: { type: [string, 'null'] }
        status: { type: string, enum: [active, disabled] }
        last_login_at: { type: [string, 'null'], format: date-time, description: Null until the person first signs in }
        created_at: { type: [string, 'null'], format: date-time }
        is_you: { type: boolean, description: True for the signed-in staff member }
    Setting:
      type: object
      properties:
        key: { type: string, example: commissions.holding_period_days, description: A path under config/affiliate.php }
        group: { type: string, example: Commission }
        label: { type: string }
        help: { type: string }
        type: { type: string, enum: [int, money, bool, choice], description: 'money is paisa' }
        min: { type: [integer, 'null'] }
        max: { type: [integer, 'null'] }
        choices: { type: [array, 'null'], items: { type: object, properties: { value: { type: string }, label: { type: string } } } }
        value: { description: 'Value in force (integer, boolean or string)' }
        default: { description: 'Value from .env / config/affiliate.php, used when there is no override' }
        overridden: { type: boolean }
        updated_at: { type: [string, 'null'], format: date-time }
        updated_by: { type: [string, 'null'], description: Name of the person who saved the override }
    SettingsList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Setting' } }
        currency: { type: string, example: NPR }
    StaffCategory:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        is_active: { type: boolean }
        products_count: { type: integer }
    MarketingAssetFields:
      type: object
      properties:
        title: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        caption: { type: [string, 'null'], maxLength: 5000 }
        campaign_id: { type: [string, 'null'] }
        product_id: { type: [string, 'null'] }
        is_active: { type: boolean }
  responses:
    Unauthenticated: { description: Not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
    Forbidden: { description: 'Missing permission, disabled account or unverified email', content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
    Invalid: { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
    TooMany: { description: Rate limited }
paths:
  /auth/register:
    post:
      security: []
      summary: Create a customer account and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, accept_privacy_notice]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
                accept_privacy_notice: { type: boolean, const: true }
                device_name: { type: string, description: Send to receive a bearer token }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooMany' }
  /auth/login:
    post:
      security: []
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooMany' }
  /auth/logout:
    post:
      summary: Sign out (deletes the current token or ends the session)
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/me:
    get:
      summary: Current user
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/User' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      summary: Change your own name or phone (20/min, audited as user.profile_updated with field names only). Email cannot be changed here.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                phone: { type: [string, 'null'], pattern: '^\+[1-9]\d{7,14}$', description: E.164 with country code; null removes it }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/User' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooMany' }
  /auth/password:
    post:
      summary: Change your own password (6/min, audited as auth.password_changed). Keeps the current session or token, deletes every other session and API token, and emails a notice.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 12, description: 'Same rules as registration; must differ from current_password' }
                password_confirmation: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/User' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { description: 'Wrong current password (errors.current_password), or a weak, unconfirmed or unchanged new password (errors.password)' }
        '429': { $ref: '#/components/responses/TooMany' }
  /auth/forgot-password:
    post:
      security: []
      summary: Email a reset link (same answer whether or not the account exists)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '429': { $ref: '#/components/responses/TooMany' }
  /auth/reset-password:
    post:
      security: []
      summary: Set a new password with the emailed token (signs out all API tokens)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '422': { $ref: '#/components/responses/Invalid' }
