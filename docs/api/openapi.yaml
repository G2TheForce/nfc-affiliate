      parameters:
        - { name: user, in: path, required: true, schema: { type: string }, description: Public ULID }
        - { name: hash, in: path, required: true, schema: { type: string } }
        - { name: expires, in: query, required: true, schema: { type: integer } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Verified (JSON clients) }
        '302': { description: "Verified; redirects to the web app's /email-verified page" }
