    post:
      summary: Record a completed refund by line; reverses only the refunded share of commission (refunds.record, audited)
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: order, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, reason]
              properties:
                reference: { type: string, minLength: 3, maxLength: 100 }
                reason: { type: string, minLength: 5, maxLength: 500 }
                items: { type: array, items: { type: object, required: [item_id, amount_minor], properties: { item_id: { type: string }, amount_minor: { type: integer, minimum: 1 } } } }
                shipping_minor: { type: integer, minimum: 0 }
      responses:
        '201': { description: 'Recorded; order detail plus meta.commission_reversed_minor' }
        '200': { description: Same reference already recorded for this order; nothing changed }
        '422': { description: 'Order not paid, line not in the order, or amount above what is left' }
  /admin/orders/{order}/fulfilment:
    post:
      summary: Move delivery forward (processing, shipped with courier, delivered). Shipping emails the customer (orders.manage, audited)
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: order, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [processing, shipped, delivered] }
                carrier: { type: [string, 'null'], maxLength: 60, description: Required for shipped }
                tracking_number: { type: [string, 'null'], maxLength: 80 }
      responses:
        '200': { description: Order detail }
        '422': { description: 'Backwards step, cancelled or refunded order, or missing courier' }
  /admin/orders/{order}/disputes:
    post:
      summary: Open a dispute or chargeback on a paid order; holds its commission (refunds.record, audited)
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: order, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, amount_minor, reason]
              properties:
                reference: { type: string, description: Bank or wallet case number }
                amount_minor: { type: integer, minimum: 1, description: At most the total not yet refunded }
                reason: { type: string }
      responses:
        '201': { description: Order detail }
        '422': { description: 'Order not paid, amount too high, a dispute already open, or reference reused' }
