        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, note]
              properties:
                outcome: { type: string, enum: [won, lost] }
                note: { type: string }
      responses:
        '200': { description: Order detail }
        '422': { description: Already closed }
  /admin/payment-attempts:
    get:
      summary: Online payment attempts (orders.view). Default filter shows those waiting for staff review.
      security: [{ bearer: [] }, { session: [] }]
