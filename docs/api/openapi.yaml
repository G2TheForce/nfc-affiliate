          application/json:
            schema:
              type: object
              required: [name, sku, slug, price_minor]
              properties:
                name: { type: string }
                sku: { type: string }
                slug: { type: string }
                description: { type: [string, 'null'] }
                price_minor: { type: integer, minimum: 1 }
                category_id: { type: [integer, 'null'] }
                is_active: { type: boolean }
