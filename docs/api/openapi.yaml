      parameters:
        - { name: order, in: path, required: true, schema: { type: string } }
        - { name: access_token, in: query, schema: { type: string } }
      responses:
        '200': { description: 'data: { paid, order_status, order_status_label, attempt: { provider, status, outcome: paid|pending|failed|checking } | null }' }
