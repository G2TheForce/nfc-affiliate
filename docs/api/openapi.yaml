        '200': { description: 'Paginated ReconciliationRun' }
    post:
      summary: Run a check now; read-only (reconciliation.view, 6/min)
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '201': { description: ReconciliationRun }
