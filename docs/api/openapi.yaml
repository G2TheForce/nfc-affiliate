          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/MarketingAssetFields'
                - type: object
                  required: [title]
                  properties:
                    file: { type: string, format: binary, description: Optional when caption is given (a text-only material) }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/StaffMarketingAsset' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooMany' }
  /admin/marketing-assets/{asset}:
    patch:
      summary: Change the details of a material (marketing_assets.manage, audited). The file cannot be replaced; a text material must keep its text.
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: asset, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MarketingAssetFields' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/StaffMarketingAsset' } } } } } }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      summary: Delete a material and its file (marketing_assets.manage, audited)
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: asset, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }
  /admin/marketing-assets/{asset}/file:
    get:
      summary: Staff download or preview of a material (marketing_assets.manage). Not counted as a download.
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: asset, in: path, required: true, schema: { type: string } }
