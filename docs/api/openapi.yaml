        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/FraudFlag' } }
                  meta: { type: object, properties: { current_page: { type: integer }, last_page: { type: integer }, total: { type: integer }, open: { type: integer, description: All open flags } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/fraud-flags/{flag}/review:
    post:
      summary: Record a finding on an open flag (fraud.review, audited as fraud_flag.reviewed). Confirming does not change money.
