      responses:
        '200': { description: 'The file, with X-Content-Type-Options nosniff and Content-Security-Policy "default-src ''none''; sandbox"' }
        '404': { description: Not found or no file }
  /admin/staff:
    get:
      summary: Staff accounts, active first, then by name (admins.manage)
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StaffMember' } }
                  roles: { type: array, description: Roles that can be given, items: { type: object, properties: { value: { type: string }, label: { type: string } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Invite a staff member (admins.manage, 20/min, audited as admin.staff_created with via=screen). Creates the account with a verified email and no usable password, and emails a set-password link.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email, maxLength: 190, description: Lower-cased; must not belong to any account }
                role: { type: string, enum: [super_admin, affiliate_manager, finance_manager, support] }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/StaffMember' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: 'Invalid, email taken, or not a staff role (errors.role)' }
        '429': { $ref: '#/components/responses/TooMany' }
  /admin/staff/{user}/invitation:
    post:
      summary: Send a new set-password link (admins.manage, 10/min, audited as admin.staff_invitation_resent)
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: user, in: path, required: true, schema: { type: string }, description: Staff member public id }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/StaffMember' } } } } } }
        '404': { description: Not a staff account }
        '422': { description: 'Already signed in, use forgot-password instead (errors.user); or the account is disabled (errors.status)' }
        '429': { $ref: '#/components/responses/TooMany' }
  /admin/staff/{user}/role:
    post:
      summary: Change a staff member's role (admins.manage, audited as admin.staff_role_changed with from and to). Removes the old staff role, assigns the new one, and deletes the person's API tokens and sessions.
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: user, in: path, required: true, schema: { type: string }, description: Staff member public id }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [super_admin, affiliate_manager, finance_manager, support] }
      responses:
        '200': { description: 'OK (also when the role was already the one asked for)', content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/StaffMember' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not a staff account }
        '422': { description: 'Not a staff role, or refused under errors.role: changing your own role or demoting the last active Super Administrator' }
  /admin/staff/{user}/status:
    post:
      summary: Disable or re-enable a staff account (admins.manage, audited as user.status_changed with via=screen). Disabling deletes the account's API tokens and sessions.
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: user, in: path, required: true, schema: { type: string }, description: Staff member public id }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [active, disabled] }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { description: 'OK (also when the status was already the one asked for)', content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/StaffMember' } } } } } }
        '404': { description: Not a staff account }
        '422': { description: 'Invalid, or refused under errors.status: disabling yourself or the last active Super Administrator' }
  /admin/settings:
    get:
      summary: The 18 programme settings with their values, defaults and who last changed them (settings.manage)
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SettingsList' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      summary: Save one or more settings (settings.manage). Each changed value is audited as setting.changed; unchanged values are skipped. Applies at once and signals queue workers to restart.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key: { type: string, description: A key from GET /admin/settings }
                      value: { description: 'Integer within min and max (money in paisa), boolean, or one of the choices' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SettingsList'
                  - type: object
                    properties:
                      changed: { type: array, items: { type: string }, description: Keys that changed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: 'Unknown key (errors["settings.N.key"]) or a value out of range (errors["settings.N.value"]). Nothing is saved.' }
  /admin/settings/{key}:
    delete:
      summary: Remove an override so the .env default applies again (settings.manage, audited as setting.reset). No change when there is no override.
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: key, in: path, required: true, schema: { type: string, pattern: '^[a-z_.]+$' } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SettingsList' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Unknown key }
  /admin/orders:
    get:
      summary: Orders with masked customer contact (orders.view); attribution filters need attribution.view
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending_payment, paid, partially_refunded, cancelled, refunded] } }
        - { name: attribution, in: query, schema: { type: string, enum: [attributed, none, blocked] } }
        - { name: affiliate_id, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string }, description: Exact order number or full email }
      responses:
        '200': { description: Paginated }
  /admin/orders/{order}:
    get:
      summary: Order detail with items, payment and refunds; attribution with attribution.view; commissions with commissions.view (orders.view)
      security: [{ bearer: [] }, { session: [] }]
