openapi: 3.1.0
info:
  title: NFC Affiliates API
  version: 1.0.0-phase7
  description: |
    Phases 1-6. Money is integer minor units (paisa) with a currency code.
    Web app: Sanctum session cookie plus X-XSRF-TOKEN.
    API clients: send `device_name` to login or register and use the returned bearer token.
    All errors are JSON. Validation errors return 422 with `message` and `errors`.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    session: { type: apiKey, in: cookie, name: laravel_session }
  schemas:
    User:
      type: object
      properties:
        id: { type: string, description: Public ULID }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'], example: '+9779812345678' }
        email_verified: { type: boolean }
        status: { type: string, enum: [active, disabled] }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        is_staff: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
    AuthResult:
      type: object
      properties:
        token: { type: string, description: Only when device_name was sent }
        token_type: { type: string, example: Bearer }
        user: { $ref: '#/components/schemas/User' }
    Message:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    AuditLog:
      type: object
      properties:
        id: { type: integer }
        action: { type: string }
        actor: { type: [object, 'null'], properties: { id: { type: string }, name: { type: string } } }
        subject_type: { type: [string, 'null'] }
        subject_id: { type: [string, 'null'] }
        properties: { type: [object, 'null'], description: Secret-looking keys are redacted }
        created_at: { type: string, format: date-time }
    AffiliateDetails:
      type: object
      properties:
        display_name: { type: string, maxLength: 120 }
        country_code: { type: string, minLength: 2, maxLength: 2, example: NP }
        city: { type: [string, 'null'] }
        address_line: { type: [string, 'null'] }
        promotion_channels:
          type: array
          minItems: 1
          items: { type: string, enum: [website, facebook, instagram, tiktok, youtube, whatsapp, viber, telegram, email, offline, other] }
        website_urls: { type: array, maxItems: 5, items: { type: string, format: uri } }
        audience_description: { type: [string, 'null'], maxLength: 2000 }
    AffiliateProfile:
      allOf:
        - $ref: '#/components/schemas/AffiliateDetails'
        - type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [pending, approved, rejected, suspended, deactivated] }
            status_label: { type: string }
            referral_code: { type: [string, 'null'] }
            referral_slug: { type: [string, 'null'] }
            applied_at: { type: [string, 'null'], format: date-time }
            approved_at: { type: [string, 'null'], format: date-time }
            can_reapply_at: { type: [string, 'null'], format: date-time }
            needs_terms_acceptance: { type: boolean }
            current_terms_version: { type: [string, 'null'] }
            history: { type: array, items: { type: object, properties: { status: { type: string }, status_label: { type: string }, reason: { type: [string, 'null'] }, at: { type: string } } } }
            terms_accepted: { type: array, items: { type: object, properties: { version: { type: string }, accepted_at: { type: string } } } }
    Product:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        price_minor: { type: integer, example: 150000 }
        currency: { type: string, example: NPR }
        category: { type: [object, 'null'], properties: { id: { type: integer }, name: { type: string }, slug: { type: string } } }
    CartItems:
      type: array
      minItems: 1
      maxItems: 50
      items: { type: object, required: [product_id, quantity], properties: { product_id: { type: string }, quantity: { type: integer, minimum: 1, maximum: 100 } } }
    Order:
      type: object
      description: Customer view. Staff responses mask email and phone and add `attribution` (attribution.view).
      properties:
        id: { type: string }
        order_number: { type: string, example: NFC-261011-7KQ2MX }
        status: { type: string, enum: [pending_payment, paid, partially_refunded, cancelled, refunded] }
        status_label: { type: string }
        currency: { type: string }
        subtotal_minor: { type: integer }
        discount_minor: { type: integer }
        shipping_minor: { type: integer }
        total_minor: { type: integer }
        coupon_code: { type: [string, 'null'] }
        placed_at: { type: string, format: date-time }
        fulfilment_status: { type: string, enum: [unfulfilled, processing, shipped, delivered], description: 'Delivery progress, separate from payment (cash on delivery ships before it is paid)' }
        fulfilment_label: { type: string }
        carrier: { type: [string, 'null'] }
        tracking_number: { type: [string, 'null'] }
        shipped_at: { type: [string, 'null'], format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        items: { type: array, items: { type: object, properties: { sku: { type: string }, name: { type: string }, unit_price_minor: { type: integer }, quantity: { type: integer }, discount_minor: { type: integer }, line_total_minor: { type: integer } } } }
    AffiliateLink:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        url: { type: string, example: 'https://store.example/ref/AB23CD45/insta-bio' }
        product: { type: [object, 'null'] }
        utm_source: { type: [string, 'null'] }
        utm_medium: { type: [string, 'null'] }
        utm_campaign: { type: [string, 'null'] }
        is_active: { type: boolean }
    ReferralTotals:
      type: object
      properties:
        clicks: { type: integer }
        unique_clicks: { type: integer }
        orders: { type: integer, description: 'Placed and not cancelled. Not sales.' }
        cancelled_orders: { type: integer }
        order_value_minor: { type: integer, description: Subtotal minus discount of placed orders }
        conversion_rate: { type: [number, 'null'], description: Orders per 100 unique clicks }
    Balances:
      type: object
      description: Sums over ledger entries, in minor units. Available can be negative (a recoverable balance after a refund of paid commission).
      properties:
        pending: { type: integer }
        approved: { type: integer }
        available: { type: integer }
        reserved: { type: integer }
        paid: { type: integer }
        reversed: { type: integer }
    Commission:
      type: object
      description: Affiliate view masks the order number. The staff view adds order_id, affiliate, rule and hold_reason, and shows the full order number.
      properties:
        id: { type: string }
        order_number: { type: string }
        product_name: { type: string }
        sku: { type: string }
        quantity: { type: integer }
        kind: { type: string, enum: [percent, fixed] }
        rate_bp: { type: [integer, 'null'] }
        fixed_minor: { type: [integer, 'null'] }
        base_minor: { type: integer, description: Line total after discounts }
        amount_minor: { type: integer, description: Amount at creation }
        reversed_minor: { type: integer }
        net_minor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [pending, approved, available, paid, reversed] }
        partially_reversed: { type: boolean }
        on_hold: { type: boolean }
        eligible_at: { type: string, format: date-time }
    LedgerEntry:
      type: object
      properties:
        type: { type: string, enum: [accrual, approval, release, refund_reversal, void, adjustment, payout_reserve, payout_release, payout_paid] }
        label: { type: string }
        from_bucket: { type: [string, 'null'] }
        to_bucket: { type: [string, 'null'] }
        amount_minor: { type: integer, minimum: 1 }
        currency: { type: string }
        commission_id: { type: [string, 'null'] }
        adjustment_id: { type: [string, 'null'] }
        payout_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    Payout:
      type: object
      description: Affiliate view. Destination is masked (bank or wallet name and last four digits).
      properties:
        id: { type: string }
        amount_minor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [requested, approved, paid, rejected, failed, cancelled] }
        status_label: { type: string }
        method_type: { type: string, enum: [bank_transfer, esewa, khalti] }
        destination: { type: string }
        requested_at: { type: string, format: date-time }
        reviewed_at: { type: [string, 'null'], format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        payment_reference: { type: [string, 'null'] }
        reason: { type: [string, 'null'], description: Rejection or failure reason }
        commission_count: { type: integer }
        can_cancel: { type: boolean }
    StaffPayout:
      allOf:
        - $ref: '#/components/schemas/Payout'
        - type: object
          properties:
            affiliate: { type: object }
            account_name: { type: string }
            review_note: { type: [string, 'null'] }
            failure_reason: { type: [string, 'null'] }
            reviewed_by: { type: [string, 'null'] }
            paid_by: { type: [string, 'null'] }
            can_review: { type: boolean }
            can_reject: { type: boolean }
            can_mark_paid: { type: boolean }
            can_mark_failed: { type: boolean }
    CommissionRule:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        scope: { type: string, enum: [global, plan, category, product, affiliate] }
        target: { type: [object, 'null'], description: 'id is the plan, product or affiliate public id, or the category slug' }
        kind: { type: string, enum: [percent, fixed, exclude] }
        rate_bp: { type: [integer, 'null'] }
        fixed_minor: { type: [integer, 'null'] }
        currency: { type: [string, 'null'] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        is_active: { type: boolean }
        version: { type: integer }
    Adjustment:
      type: object
      properties:
        id: { type: string }
        affiliate: { type: object }
        commission_id: { type: [string, 'null'] }
        amount_minor: { type: integer, description: Signed }
        reason: { type: string }
        status: { type: string, enum: [pending_approval, approved, rejected] }
        created_by: { type: [string, 'null'] }
        can_decide: { type: boolean, description: False for the proposer }
        decided_by: { type: [string, 'null'] }
    ReconciliationRun:
      type: object
      properties:
        id: { type: string }
        result: { type: string, enum: [clean, drift] }
        commissions_checked: { type: integer }
        affiliates_checked: { type: integer }
        entries_checked: { type: integer }
        issues: { type: array, items: { type: object } }
        triggered_by: { type: string }
        finished_at: { type: string, format: date-time }
    PaymentAttempt:
      type: object
      description: One customer attempt to pay online. Only the provider's status API can complete it.
      properties:
        id: { type: string }
        order: { type: object, properties: { id: { type: string }, order_number: { type: string } } }
        provider: { type: string, enum: [esewa, khalti] }
        provider_reference: { type: [string, 'null'], description: eSewa transaction_uuid or Khalti pidx }
        provider_transaction_id: { type: [string, 'null'] }
        amount_minor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [initiated, pending, completed, failed, needs_review] }
        status_label: { type: string }
        provider_status: { type: [string, 'null'], example: COMPLETE }
        review_reason: { type: [string, 'null'] }
        reviewed_by: { type: [string, 'null'] }
        reviewed_at: { type: [string, 'null'], format: date-time }
        review_note: { type: [string, 'null'] }
        check_count: { type: integer }
        last_checked_at: { type: [string, 'null'], format: date-time }
        next_check_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
  responses:
    Unauthenticated: { description: Not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
    Forbidden: { description: 'Missing permission, disabled account or unverified email', content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
    Invalid: { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
    TooMany: { description: Rate limited }
paths:
  /auth/register:
    post:
      security: []
      summary: Create a customer account and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, accept_privacy_notice]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
                accept_privacy_notice: { type: boolean, const: true }
                device_name: { type: string, description: Send to receive a bearer token }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooMany' }
  /auth/login:
    post:
      security: []
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooMany' }
  /auth/logout:
    post:
      summary: Sign out (deletes the current token or ends the session)
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/me:
    get:
      summary: Current user
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/User' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/forgot-password:
    post:
      security: []
      summary: Email a reset link (same answer whether or not the account exists)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '429': { $ref: '#/components/responses/TooMany' }
  /auth/reset-password:
    post:
      security: []
      summary: Set a new password with the emailed token (signs out all API tokens)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '422': { $ref: '#/components/responses/Invalid' }
  /auth/verify-email/{user}/{hash}:
    get:
      security: []
      summary: Signed link from the verification email
      parameters:
        - { name: user, in: path, required: true, schema: { type: string }, description: Public ULID }
        - { name: hash, in: path, required: true, schema: { type: string } }
        - { name: expires, in: query, required: true, schema: { type: integer } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Verified (JSON clients) }
        '302': { description: "Verified; redirects to the web app's /email-verified page" }
        '403': { description: 'Invalid, tampered or expired link' }
  /auth/email/verification-notification:
    post:
      summary: Send a new verification link
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: Already verified }
        '202': { description: Link queued }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /admin/ping:
    get:
      summary: Staff access check (requires admin.access and a verified email)
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/audit-logs:
    get:
      summary: Audit log (requires audit_logs.view)
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: subject_type, in: query, schema: { type: string } }
        - { name: subject_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Paginated entries, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
                  links: { type: object }
                  meta: { type: object }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications:
    get:
      summary: The signed-in user's in-app notifications (20 per page, newest first)
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: 'data[] with id, title, body, link, read, created_at; meta.unread' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /notifications/{id}/read:
    post:
      summary: Mark one of your own notifications as read (another user's id returns 404)
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /notifications/read-all:
    post:
      summary: Mark all your notifications as read
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: OK }
  /affiliate/terms/current:
    get:
      summary: Current published affiliate terms (data is null when none are published)
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: 'data: { version, title, body, published_at } or null' }
  /affiliate/terms/accept:
    post:
      summary: Accept the current terms version (approved members after a terms change)
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terms_version, accept_terms]
              properties:
                terms_version: { type: string }
                accept_terms: { type: boolean, const: true }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AffiliateProfile' } } } } } }
        '422': { $ref: '#/components/responses/Invalid' }
  /affiliate/applications:
    post:
      summary: Apply to the affiliate programme, or re-apply after a rejection and the cooldown
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AffiliateDetails'
                - type: object
                  required: [terms_version, accept_terms]
                  properties:
                    terms_version: { type: string, description: The version shown to the applicant; must be the current one }
                    accept_terms: { type: boolean, const: true }
      responses:
        '201': { description: Pending application, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AffiliateProfile' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /affiliate/profile:
    get:
      summary: Your own affiliate profile (data is null before applying). Never contains internal notes.
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AffiliateProfile' } } } } } }
    patch:
      summary: Update your non-sensitive profile fields (pending, approved or suspended)
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/AffiliateDetails' } } }
      responses:
        '200': { description: OK }
        '404': { description: No application yet }
        '422': { $ref: '#/components/responses/Invalid' }
  /affiliate/profile/close:
    post:
      summary: Close your own approved membership (requires your password)
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                reason: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Deactivated profile }
        '422': { $ref: '#/components/responses/Invalid' }
  /admin/affiliates:
    get:
      summary: List affiliates, pending first (affiliates.view)
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, suspended, deactivated] } }
        - { name: search, in: query, schema: { type: string }, description: 'Name, email or exact referral code' }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        '200': { description: Paginated list }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/affiliates/counts:
    get:
      summary: Number of affiliates per status (affiliates.view)
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: 'data: { pending, approved, rejected, suspended, deactivated }' }
  /admin/affiliates/{affiliate}:
    get:
      summary: Staff detail with history, internal notes and possible duplicates (affiliates.view)
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: affiliate, in: path, required: true, schema: { type: string }, description: Public ULID }]
      responses:
        '200': { description: OK }
        '404': { description: Not found }
  /admin/affiliates/{affiliate}/{action}:
    post:
      summary: 'Membership action. approve/reject need affiliates.review; suspend/reinstate/deactivate/reactivate need affiliates.suspend. reason is required except for approve.'
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: affiliate, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, reject, suspend, reinstate, deactivate, reactivate] } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, minLength: 5, maxLength: 1000, description: Shown to the member }
                internal_note: { type: string, maxLength: 5000, description: Staff only }
      responses:
