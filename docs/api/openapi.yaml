                  data: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
                  meta: { type: object, properties: { current_page: { type: integer }, last_page: { type: integer }, total: { type: integer } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a campaign (campaigns.manage, audited as campaign.created). Its rate is a commission rule with scope campaign.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
