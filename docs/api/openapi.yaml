    post:
      summary: Cancel own request before finance reviews it; funds return to available (affiliate.payouts.request)
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: payout, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Payout }
        '404': { description: Not your payout }
        '422': { description: Already reviewed }
  /affiliate/payout-method:
    put:
      summary: 'Save where payouts are sent (affiliate.payouts.request, 6/min). Needs the account password. Details are stored encrypted; responses show a masked form; an email notice is sent.'
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, account_name, password]
              properties:
                type: { type: string, enum: [bank_transfer, esewa, khalti] }
                account_name: { type: string }
                bank_name: { type: string, description: Required for bank_transfer }
                branch: { type: [string, 'null'] }
                account_number: { type: string, pattern: '^[A-Za-z0-9-]{6,30}$', description: Required for bank_transfer }
                wallet_id: { type: string, pattern: '^9[678][0-9]{8}$', description: Required for esewa and khalti }
                password: { type: string, format: password }
      responses:
        '200': { description: 'data: { type, type_label, account_name, masked, updated_at }' }
