    get:
      security: []
      summary: Whether this browser holds a valid referral (first-party web app only)
      responses:
        '200': { description: 'data: { referred: boolean, affiliate_name: string|null }' }
  /store/affiliate-programme:
    get:
      security: []
      summary: Public facts for the affiliate programme page, from live settings, the global rule in force and the current terms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      currency: { type: string }
                      standard_rate:
                        type: [object, 'null']
                        description: The newest global percent or fixed rule in force; null when none. Plan, affiliate, product and campaign rates are never shown.
                        properties: { kind: { type: string, enum: [percent, fixed] }, rate_bp: { type: [integer, 'null'] }, fixed_minor: { type: [integer, 'null'] } }
                      attribution_window_days: { type: integer }
                      holding_period_days: { type: integer }
                      payout_minimum_minor: { type: integer }
                      payout_methods: { type: array, items: { type: string }, example: [Bank transfer, eSewa, Khalti] }
                      terms:
                        type: [object, 'null']
                        properties: { version: { type: string }, title: { type: string }, body: { type: string }, published_at: { type: string, format: date-time } }
  /store/cart/quote:
    post:
      security: []
      summary: Price a cart and optional coupon without creating anything
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { $ref: '#/components/schemas/CartItems' }
                coupon_code: { type: [string, 'null'] }
                customer_email: { type: [string, 'null'], description: For per-customer coupon limits }
      responses:
        '200': { description: 'data: subtotal_minor, discount_minor, shipping_minor, total_minor, lines' }
        '422': { $ref: '#/components/responses/Invalid' }
  /store/orders:
    post:
      security: []
      summary: Place an order (guest or signed in). Created as pending_payment; attribution is decided here.
      description: |
        Attribution precedence (default): affiliate coupon, then `referral_code`, then the referral cookie
        (web app only, last click within 30 days). Self-referrals and inactive affiliates are not credited.
        Send an `Idempotency-Key` header so a retried request returns the same order.
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, pattern: '^[A-Za-z0-9-]{16,80}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, customer_name, customer_phone, shipping_city, shipping_address]
              properties:
                items: { $ref: '#/components/schemas/CartItems' }
                customer_name: { type: string }
                customer_email: { type: string, format: email, description: Required for guests; signed-in customers use their account email }
                customer_phone: { type: string, example: '+9779812345678' }
                shipping_city: { type: string }
                shipping_address: { type: string }
                coupon_code: { type: [string, 'null'] }
                referral_code: { type: [string, 'null'], description: An affiliate's referral code or slug }
      responses:
        '201': { description: 'Created. meta.access_token lets the browser pay and follow this order. It is returned on every checkout; a replay with the same Idempotency-Key issues a new token that replaces the old one.', content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Order' }, meta: { type: object, properties: { access_token: { type: string } } } } } } } }
        '200': { description: Replay of an earlier request with the same Idempotency-Key }
        '409': { description: Idempotency-Key reused for a different request }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/TooMany' }
