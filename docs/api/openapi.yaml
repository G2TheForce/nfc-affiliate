      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Campaign' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /admin/campaigns/{campaign}:
    get:
      summary: One campaign with results (campaigns.manage, commission_rules.manage or commissions.view)
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: campaign, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Campaign' } } } } } }
        '404': { description: Not found }
    patch:
      summary: Change a campaign (campaigns.manage, audited as campaign.updated). Send only the fields to change. There is no delete.
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: campaign, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CampaignInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Campaign' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
  /admin/marketing-assets:
    get:
      summary: Marketing library (marketing_assets.manage), 50 per page
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: campaign_id, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StaffMarketingAsset' } }
                  meta: { type: object, properties: { current_page: { type: integer }, last_page: { type: integer }, total: { type: integer } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 'Upload a file or add post text (marketing_assets.manage, 30/min, audited). The type is detected from the content: JPEG, PNG, WebP, GIF, MP4, PDF or ZIP; SVG and others are refused. Size limit AFFILIATE_MARKETING_MAX_UPLOAD_KB (default 20480).'
      security: [{ bearer: [] }, { session: [] }]
