        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Product' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: 'Not an accepted image, too large, or could not be saved (errors.image)' }
        '429': { $ref: '#/components/responses/TooMany' }
    delete:
      summary: Remove the product photo and delete its file (catalog.manage, audited as product.image_removed). No change if there is none.
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: product, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Product' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/categories:
    get:
      summary: Categories, including hidden ones, with product counts (catalog.manage)
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/StaffCategory' } } } } } } }
    post:
      summary: Create a category (catalog.manage, audited as product_category.created)
      security: [{ bearer: [] }, { session: [] }]
