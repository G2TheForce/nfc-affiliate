    get:
      security: []
      summary: Online payment providers that are switched on (eSewa, Khalti), with each one's minimum amount
      responses:
        '200': { description: 'data: [{ key, label, minimum_minor }]' }
  /store/orders/{order}/payments:
    post:
      security: []
      summary: Start an online payment for a pending order. Returns where to send the browser; nothing is paid yet.
      description: |
        Guests prove the order is theirs with the `access_token` returned once in `meta.access_token` when the
        order was placed; signed-in owners may omit it. eSewa returns a signed form to POST; Khalti returns a page URL.
      parameters: [{ name: order, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string, enum: [esewa, khalti] }
                access_token: { type: string }
      responses:
        '201': { description: 'data: { attempt_id, redirect: { type: form|redirect, url, fields? } }' }
