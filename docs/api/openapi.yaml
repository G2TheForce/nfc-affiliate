                fixed_minor: { type: integer, minimum: 1 }
                starts_at: { type: string, format: date-time }
                ends_at: { type: [string, 'null'], format: date-time }
                is_active: { type: boolean }
      responses:
        '201': { description: Created }
        '422': { $ref: '#/components/responses/Invalid' }
