        '200': { description: 'Paginated LedgerEntry' }
  /affiliate/earnings/rates:
    get:
      summary: Rates that apply today, per active product (approved members only)
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: 'data: { default, products[], notes[] }' }
  /affiliate/payouts/summary:
    get:
      summary: Own available, reserved and paid balances, minimum, masked payout details, the open payout and whether a request is possible (affiliate.portal)
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: 'data: { available_minor, reserved_minor, paid_minor, minimum_minor, method, open_payout, can_request, blocker }' }
  /affiliate/payouts:
    get:
      summary: Own payouts, newest first (affiliate.portal)
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: 'Paginated Payout' }
    post:
      summary: 'Request the whole available balance (affiliate.payouts.request, 6/min). Needs an active membership, saved payout details, no open payout and at least the minimum (NPR 1,000). Reserves the funds.'
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '201': { description: Payout }
        '422': { description: 'errors.payout explains why not' }
