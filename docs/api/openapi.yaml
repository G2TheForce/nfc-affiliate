        required: true
        content: { application/json: { schema: { type: object, required: [affiliate_id, reason], properties: { affiliate_id: { type: string }, reason: { type: string, minLength: 10 } } } } }
      responses:
        '200': { description: Updated detail }
        '422': { description: 'Self-referral, cancelled order, or an unknown or unapproved affiliate' }
  /admin/referrals/summary:
    get:
      summary: Programme totals and top affiliates (reports.view)
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: 'data: totals (ReferralTotals), top_affiliates[]' }
  /admin/orders/{order}/payments:
    post:
      summary: Confirm a payment staff have verified, with its reference; marks the order paid and creates commission (payments.confirm, audited)
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: order, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, reference, amount_minor]
              properties:
                method: { type: string, enum: [bank_transfer, cash_on_delivery, esewa, khalti, fonepay, other] }
                reference: { type: string, minLength: 3, maxLength: 100 }
                amount_minor: { type: integer, description: Must equal the order total }
                note: { type: [string, 'null'] }
      responses:
        '201': { description: Recorded; order detail }
