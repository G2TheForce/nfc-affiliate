        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                slug: { type: string, maxLength: 140, pattern: '^[a-z0-9][a-z0-9-]*$' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { id: { type: integer }, name: { type: string }, slug: { type: string }, is_active: { type: boolean } } } } } } } }
        '422': { $ref: '#/components/responses/Invalid' }
  /admin/categories/{category}:
    patch:
      summary: Rename, hide or show a category (catalog.manage). Saved and audited as product_category.updated in one transaction, only when something changed. The slug cannot change.
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: category, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                is_active: { type: boolean, description: false hides the category from GET /store/categories; its products stay listed }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/StaffCategory' } } } } } }
        '404': { description: Not found }
        '422': { description: 'Invalid, or slug sent (errors.slug)' }
    delete:
      summary: Delete an unused category (catalog.manage). Deleted and audited as product_category.deleted in one transaction.
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: category, in: path, required: true, schema: { type: integer } }]
      responses:
        '204': { description: Deleted }
        '404': { description: Not found }
        '422': { description: 'Refused under errors.category while the category has products, past order lines or a commission rule' }
  /admin/coupons:
    get:
      summary: Coupons with usage counts (campaigns.manage)
      security: [{ bearer: [] }, { session: [] }]
      responses:
        '200': { description: OK }
    post:
      summary: Create a coupon, optionally owned by an affiliate (campaigns.manage, audited)
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, discount_type, discount_value]
              properties:
                code: { type: string }
                affiliate_id: { type: [string, 'null'] }
                discount_type: { type: string, enum: [percent, fixed] }
                discount_value: { type: integer, description: 'Basis points for percent (1000 = 10%), paisa for fixed' }
                min_order_minor: { type: integer }
                max_discount_minor: { type: [integer, 'null'] }
                usage_limit: { type: [integer, 'null'] }
                per_customer_limit: { type: [integer, 'null'] }
                starts_at: { type: [string, 'null'], format: date-time }
                ends_at: { type: [string, 'null'], format: date-time }
                is_active: { type: boolean }
                earns_commission: { type: boolean }
                campaign_id: { type: [string, 'null'], description: Campaign public id; orders with this coupon count for the campaign while it runs }
                product_ids: { type: array, items: { type: string }, description: Empty means all products }
      responses:
        '201': { description: 'Created; the coupon includes campaign: { id, name } or null' }
        '422': { $ref: '#/components/responses/Invalid' }
  /admin/coupons/{coupon}:
    patch:
      summary: Update a coupon (campaigns.manage), including campaign_id (null unlinks). The code cannot change after it has been used.
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: coupon, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
  /admin/campaigns:
    get:
      summary: Campaigns with results (campaigns.manage, commission_rules.manage or commissions.view), 50 per page
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [running, upcoming, ended, all], default: all } }
        - { name: page, in: query, schema: { type: integer } }
