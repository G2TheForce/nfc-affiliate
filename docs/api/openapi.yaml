      responses:
        '200': { description: 'Paginated Adjustment' }
    post:
      summary: Propose a signed adjustment (commissions.adjust). Nothing reaches the ledger until someone else approves it.
      security: [{ bearer: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [affiliate_id, amount_minor, reason]
              properties:
                affiliate_id: { type: string }
                commission_id: { type: [string, 'null'] }
                amount_minor: { type: integer, description: 'Non-zero; negative deducts' }
                reason: { type: string, minLength: 10 }
      responses:
        '201': { description: Proposed }
  /admin/adjustments/{adjustment}/approve:
    post:
      summary: Approve and post to the ledger (commissions.approve; not the proposer)
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: adjustment, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Approved }
        '422': { description: 'Proposer cannot approve, or already decided' }
  /admin/adjustments/{adjustment}/reject:
    post:
      summary: Reject with a note (commissions.approve)
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: adjustment, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Rejected }
  /admin/reconciliation:
    get:
      summary: Reconciliation runs, newest first (reconciliation.view)
      security: [{ bearer: [] }, { session: [] }]
