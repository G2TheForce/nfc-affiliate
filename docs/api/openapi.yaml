        '200': { description: 'data: { balances: Balances, on_hold_minor, auto_release, holding_period_days }' }
  /admin/commissions/{commission}:
    get:
      summary: One commission with its calculation snapshot and ledger entries (commissions.view)
      security: [{ bearer: [] }, { session: [] }]
      parameters: [{ name: commission, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
  /admin/commissions/{commission}/{action}:
    post:
      summary: 'hold (reason), release-hold (note) and void (reason) need fraud.review; release needs commissions.approve. All audited.'
      security: [{ bearer: [] }, { session: [] }]
      parameters:
        - { name: commission, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [hold, release-hold, void, release] } }
      responses:
        '200': { description: Updated commission }
        '422': { description: Not allowed from the current state }
  /admin/adjustments:
    get:
      summary: Adjustments (commissions.view)
