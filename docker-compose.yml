# Optional local environment: MySQL 8 and Mailpit (catches outgoing email).
# The PHP app runs on your machine with `php artisan serve`.
#   docker compose up -d
# MySQL is bound to 127.0.0.1 only. Do not expose it publicly.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nfc_affiliate}
      MYSQL_USER: ${DB_USERNAME:-nfc_affiliate}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI: http://localhost:8025

volumes:
  mysql-data:
